spring.application.name=compostsystem

# Keep JDBC interpretation and MySQL NOW()/CURRENT_TIMESTAMP in the same timezone.
# A Railway SPRING_DATASOURCE_URL overrides this default and needs these options too.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/compost_system?useSSL=false&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&preserveInstants=true&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

server.port=${PORT:8080}

app.session.duration-minutes=60
app.password-reset.expiration-minutes=30
app.otp.expiration-minutes=10
app.notification.email=${NOTIFICATION_EMAIL:}
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.sensor.connection-timeout-seconds=180
app.sensor.connection-check-milliseconds=5000

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Explicitly select gmail-api on Railway; auto preserves existing local configurations.
app.email.provider=${EMAIL_PROVIDER:auto}
app.email.gmail.client-id=${GMAIL_CLIENT_ID:}
app.email.gmail.client-secret=${GMAIL_CLIENT_SECRET:}
app.email.gmail.refresh-token=${GMAIL_REFRESH_TOKEN:}

# Optional alternative HTTPS provider.
app.email.resend-api-key=${RESEND_API_KEY:}
app.email.from=${RESEND_FROM_EMAIL:}

gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}

