spring.application.name=compostsystem

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/compost_system?useSSL=false&serverTimezone=Asia/Manila&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

server.port=${PORT:8080}

app.session.duration-minutes=60
app.password-reset.expiration-minutes=30
app.otp.expiration-minutes=10
app.notification.email=${NOTIFICATION_EMAIL:}
app.sensor.connection-timeout-seconds=180
app.sensor.connection-check-milliseconds=5000

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

gemini.api.key=${GEMINI_API_KEY:}
gemini.model=gemini-2.5-flash

